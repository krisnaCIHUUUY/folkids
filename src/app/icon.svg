  <circle cx="53" cy="55" r="2.6" fill="#1e4285"/>
  <circle cx="67" cy="55" r="2.6" fill="#1e4285"/>
  <path d="M52.5 62 Q 60 68.5 67.5 62" stroke="#1e4285" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Buku terbuka -->
  <path d="M60 100
