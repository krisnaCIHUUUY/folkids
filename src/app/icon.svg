  <path d="M60 100
           C 71 92, 87 89, 101 92
           C 103.5 92.5, 105 90.5, 105 88
           L 105 72
           C 105 69.5, 103.5 68, 101 67.5
           C 87 65, 71 68, 60 76 Z"
        fill="#fdf0d0" stroke="#2b5cb8" stroke-width="5" stroke-linejoin="round"/>

  <!-- Garis teks pada halaman -->
  <path d="M25 77 C 33 75.5, 41 76, 47 78.5" stroke="#2b5cb8" stroke-width="2.4" stroke-linecap="round" opacity="0.45"/>
  <path d="M25 84 C 33 82.5, 41 83, 47 85.5" stroke="#2b5cb8" stroke-width="2.4" stroke-linecap="round" opacity="0.45"/>
  <path d="M95 77 C 87 75.5, 79 76, 73 78.5" stroke="#2b5cb8" stroke-width="2.4" stroke-linecap="round" opacity="0.45"/>
  <path d="M95 84 C 87 82.5, 79 83, 73 85.5" stroke="#2b5cb8" stroke-width="2.4" stroke-linecap="round" opacity="0.45"/>
