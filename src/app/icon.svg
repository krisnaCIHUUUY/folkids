  <path d="M24 14 L25.6 18.9 L30.5 20.5 L25.6 22.1 L24 27 L22.4 22.1 L17.5 20.5 L22.4 18.9 Z" fill="#f5b21e" opacity="0.85"/>

  <!-- Gunungan (bentuk daun/bawang khas wayang) -->
  <circle cx="60" cy="19" r="4.5" fill="#f5b21e"/>
  <path d="M60 26
           C 52 34, 43 44, 40 57
           C 37.5 68, 45 78, 60 78
           C 75 78, 82.5 68, 80 57
           C 77 44, 68 34, 60 26 Z"
