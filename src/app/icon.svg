<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Logo Folkids (ikon) — gunungan wayang emas tersenyum, terbit dari buku cerita terbuka -->

  <!-- Kilau bintang (aksen playful) -->
